<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SC2 Map Runtime Lab</title>
  <link rel="stylesheet" href="/debug-map.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">SC2 RUNTIME LAB</p>
        <h1>地图运行时测试</h1>
        <p class="subhead">原始地图只读，Mod 按会话加载。</p>
      </div>
      <div id="runtime-badge" class="badge idle">未启动</div>
    </header>

    <section class="grid">
      <article class="panel map-panel">
        <div class="panel-heading"><h2>地图输入</h2><button id="refresh" class="icon-button" title="刷新地图和 Mod 列表">↻</button></div>
        <div id="map-meta" class="map-meta">读取中…</div>
        <div class="dependency-title">地图声明依赖</div>
        <ul id="map-dependencies" class="dependency-list"></ul>
      </article>

      <article class="panel launch-panel">
        <div class="panel-heading"><h2>运行会话</h2><span id="session-id" class="muted">无</span></div>
        <label>API 端口<input id="port" type="number" min="1" max="65535" value="5869"></label>
        <label>验证场景<input id="verify" type="text" value="tools/cmre-webui/debug_map_smoke.vtest"></label>
        <button id="launch" class="primary">准备并启动</button>
        <button id="prepare" class="secondary">只生成依赖 Shim</button>
        <pre id="log" class="log">等待操作…</pre>
      </article>
    </section>

    <section class="panel mods-panel">
      <div class="panel-heading"><h2>按需加载 Mod</h2><span id="mod-count" class="muted">0</span></div>
      <p class="hint">列表只显示能映射到当前 SC2 安装的运行时路径；勾选内容仅写入本次会话 Shim。</p>
      <div id="mods" class="mod-list">读取中…</div>
    </section>
  </main>
  <script src="/debug-map.js"></script>
</body>
</html>
